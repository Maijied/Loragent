<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Loragent Official Brand Logo">
  <defs>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF"/>
      <stop offset="100%" stop-color="#00A3FF"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#39FF14"/>
      <stop offset="100%" stop-color="#00FF41"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BC13FE"/>
      <stop offset="100%" stop-color="#7928CA"/>
    </linearGradient>
    <linearGradient id="bodyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="50%" stop-color="#02040a"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="circ" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1.5" fill="#00FF41" opacity="0.15"/>
      <path d="M 0 20 L 40 20 M 20 0 L 20 40" stroke="#00F3FF" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" rx="24" fill="url(#darkBg)" stroke="#00FF41" stroke-width="1.5" stroke-opacity="0.3"/>
  <rect width="1200" height="400" rx="24" fill="url(#circ)"/>

  <!-- Left Mascot (Lorapok Cyber Larva) -->
  <g transform="translate(180, 200)">
    <!-- Aura glow -->
    <ellipse cx="0" cy="0" rx="140" ry="110" fill="#00FF41" opacity="0.08" filter="url(#glow)"/>

    <!-- Tail & Body Segments -->
    <ellipse cx="-70" cy="15" rx="35" ry="40" fill="url(#bodyGradient)" opacity="0.85"/>
    <ellipse cx="-40" cy="8" rx="42" ry="48" fill="url(#bodyGradient)" opacity="0.95"/>
    <ellipse cx="-5" cy="0" rx="50" ry="56" fill="url(#bodyGradient)"/>
    
    <!-- Head -->
    <ellipse cx="45" cy="-8" rx="58" ry="62" fill="url(#bodyGradient)"/>
    
    <!-- Belly luminous segments -->
    <path d="M -70 28 Q -40 38 -5 32 Q 30 25 50 15" fill="none" stroke="#39FF14" stroke-width="5" opacity="0.7" filter="url(#glow)"/>

    <!-- Goggles / Visor -->
    <rect x="25" y="-35" width="70" height="45" rx="16" fill="#030712" stroke="#00F3FF" stroke-width="3.5" filter="url(#glow)"/>
    
    <!-- Glowing Cyber Eyes -->
    <circle cx="45" cy="-12" r="10" fill="#39FF14" filter="url(#glow)"/>
    <circle cx="75" cy="-12" r="10" fill="#39FF14" filter="url(#glow)"/>
    <circle cx="48" cy="-15" r="3.5" fill="#ffffff"/>
    <circle cx="78" cy="-15" r="3.5" fill="#ffffff"/>

    <!-- Antennae -->
    <path d="M 30 -65 Q 20 -85 10 -95" fill="none" stroke="#00F3FF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="10" cy="-95" r="6" fill="#00F3FF" filter="url(#glow)"/>
    
    <path d="M 65 -65 Q 80 -85 95 -95" fill="none" stroke="#39FF14" stroke-width="4" stroke-linecap="round"/>
    <circle cx="95" cy="-95" r="6" fill="#39FF14" filter="url(#glow)"/>

    <!-- Holographic Orbit Ring -->
    <ellipse cx="0" cy="10" rx="120" ry="40" fill="none" stroke="#00F3FF" stroke-width="2" stroke-dasharray="6 4" opacity="0.6" transform="rotate(-15)"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(420, 165)">
    <!-- Subtitle Badge -->
    <rect x="0" y="-85" width="340" height="32" rx="8" fill="rgba(0, 255, 65, 0.1)" stroke="rgba(0, 255, 65, 0.3)" stroke-width="1"/>
    <text x="16" y="-64" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" fill="#00FF41" letter-spacing="2">
      ⚡ LORAPOK LABS ECOSYSTEM
    </text>

    <!-- Main Title -->
    <text x="0" y="20" font-family="'Inter', system-ui, sans-serif" font-size="92" font-weight="900" fill="#ffffff" letter-spacing="-3">
      LOR<tspan fill="#00FF41">AGENT</tspan>
    </text>

    <!-- Tagline -->
    <text x="4" y="70" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="500" fill="#94a3b8" letter-spacing="0">
      Universal Multi-Agent Orchestration &amp; 224+ AI Roster
    </text>

    <!-- Feature Tags -->
    <g transform="translate(4, 110)">
      <rect x="0" y="0" width="130" height="28" rx="6" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" stroke-width="1"/>
      <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00F3FF">224+ AGENTS</text>

      <rect x="142" y="0" width="120" height="28" rx="6" fill="rgba(168, 85, 247, 0.15)" stroke="#a855f7" stroke-width="1"/>
      <text x="154" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#BC13FE">6 SQUADS</text>

      <rect x="274" y="0" width="130" height="28" rx="6" fill="rgba(0, 255, 65, 0.15)" stroke="#00FF41" stroke-width="1"/>
      <text x="286" y="18" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#00FF41">ZERO-TRUST</text>
    </g>
  </g>
</svg>
