<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" fill="none" role="img" aria-label="Loragent GitHub Social Preview">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050b14"/>
      <stop offset="45%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#010206"/>
    </linearGradient>

    <radialGradient id="cyanFlare" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#00F3FF" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#00F3FF" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#00F3FF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="emeraldFlare" cx="85%" cy="80%" r="55%">
      <stop offset="0%" stop-color="#00FF41" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#00FF41" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#00FF41" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetFlare" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#BC13FE" stop-opacity="0.10"/>
      <stop offset="70%" stop-color="#BC13FE" stop-opacity="0"/>
    </radialGradient>

    <!-- Neon Cyber Border -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F3FF" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#00FF41" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#BC13FE" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#050b14" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1280" height="640" fill="url(#bgGrad)"/>
  <rect width="1280" height="640" fill="url(#cyanFlare)"/>
  <rect width="1280" height="640" fill="url(#emeraldFlare)"/>
  <rect width="1280" height="640" fill="url(#violetFlare)"/>

  <!-- Subtle Cyber Grid -->
  <g stroke="rgba(255, 255, 255, 0.025)" stroke-width="1">
    <line x1="80" y1="0" x2="80" y2="640"/>
    <line x1="240" y1="0" x2="240" y2="640"/>
    <line x1="400" y1="0" x2="400" y2="640"/>
    <line x1="560" y1="0" x2="560" y2="640"/>
    <line x1="720" y1="0" x2="720" y2="640"/>
    <line x1="880" y1="0" x2="880" y2="640"/>
    <line x1="1040" y1="0" x2="1040" y2="640"/>
    <line x1="1200" y1="0" x2="1200" y2="640"/>

    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="0" y1="320" x2="1280" y2="320"/>
    <line x1="0" y1="400" x2="1280" y2="400"/>
    <line x1="0" y1="480" x2="1280" y2="480"/>
    <line x1="0" y1="560" x2="1280" y2="560"/>
  </g>

  <!-- Framing Inner Border -->
  <rect x="20" y="20" width="1240" height="600" rx="20" fill="none" stroke="url(#borderGrad)" stroke-width="2.5" opacity="0.75"/>
  <rect x="24" y="24" width="1232" height="592" rx="17" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>

  <!-- Left Content Column -->
  <g transform="translate(80, 85)">
    <!-- Top Pill Badge -->
    <g>
      <rect x="0" y="0" width="310" height="34" rx="17" fill="rgba(0, 255, 65, 0.08)" stroke="#00FF41" stroke-width="1.2"/>
      <circle cx="18" cy="17" r="5" fill="#00FF41" filter="url(#softGlow)"/>
      <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#00FF41" letter-spacing="1.5">
        LORAPOK LABS OFFICIAL ECOSYSTEM
      </text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 75)">
      <text x="0" y="45" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="-2">
        LOR<tspan fill="#00FF41">AGENT</tspan>
      </text>
      <!-- Version Tag -->
      <rect x="420" y="3" width="76" height="28" rx="8" fill="rgba(56, 189, 248, 0.15)" stroke="#38BDF8" stroke-width="1"/>
      <text x="432" y="22" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="700" fill="#38BDF8">v2.0.1</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="156" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#38BDF8" letter-spacing="-0.3">
      Universal Multi-Agent Orchestration &amp; 242+ AI Roster
    </text>

    <!-- Value Proposition -->
    <text x="0" y="196" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">
      Deterministic Hub-and-Spoke Topology with 6 Squad Formations across 28+ AI IDEs.
    </text>
    <text x="0" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">
      Zero-Trust AES-256 TiTi Vault enclave with native MCP connector mesh.
    </text>

    <!-- Stat Matrix Cards -->
    <g transform="translate(0, 260)">
      <!-- Card 1: Agents -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="150" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(0, 255, 65, 0.3)" stroke-width="1.2"/>
        <text x="18" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#00FF41">242+</text>
        <text x="18" y="56" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#94A3B8">Specialist Agents</text>
      </g>

      <!-- Card 2: MCPs -->
      <g transform="translate(165, 0)">
        <rect x="0" y="0" width="150" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(0, 243, 255, 0.3)" stroke-width="1.2"/>
        <text x="18" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#00F3FF">20 MCPs</text>
        <text x="18" y="56" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#94A3B8">Native Tool Mesh</text>
      </g>

      <!-- Card 3: Formations -->
      <g transform="translate(330, 0)">
        <rect x="0" y="0" width="150" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(188, 19, 254, 0.35)" stroke-width="1.2"/>
        <text x="18" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#BC13FE">6 Squads</text>
        <text x="18" y="56" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#94A3B8">Dynamic Formations</text>
      </g>

      <!-- Card 4: Vault -->
      <g transform="translate(495, 0)">
        <rect x="0" y="0" width="150" height="74" rx="14" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.2"/>
        <text x="18" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="900" fill="#F59E0B">TiTi Vault</text>
        <text x="18" y="56" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="600" fill="#94A3B8">Zero-Trust AES-256</text>
      </g>
    </g>

    <!-- Quickstart Terminal Bar -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="645" height="46" rx="12" fill="#030712" stroke="rgba(0, 255, 65, 0.35)" stroke-width="1.2"/>
      <circle cx="20" cy="23" r="4.5" fill="#EF4444"/>
      <circle cx="36" cy="23" r="4.5" fill="#F59E0B"/>
      <circle cx="52" cy="23" r="4.5" fill="#10B981"/>
      <text x="76" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" font-weight="600" fill="#E2E8F0">
        $ npx -y loragent@latest
      </text>
      <rect x="290" y="15" width="8" height="17" fill="#00FF41" filter="url(#softGlow)"/>
      <text x="480" y="28" font-family="'JetBrains Mono', Consolas, monospace" font-size="12" font-weight="600" fill="#64748B">
        npm · pip · go · vsix
      </text>
    </g>

    <!-- IDE Compatibility Ribbon -->
    <g transform="translate(0, 428)">
      <text x="0" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#64748B" letter-spacing="1">
        COMPATIBLE WITH 28+ AI IDES:
      </text>
      <text x="210" y="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#94A3B8">
        Cursor · Claude Code · Windsurf · Antigravity · Roo Code · Cline · Zed · Codex
      </text>
    </g>
  </g>

  <!-- Right Visual Feature: Cyber Orb Emblem & Crest -->
  <g transform="translate(1010, 320)">
    <!-- Ambient Energy Aura -->
    <circle cx="0" cy="0" r="220" fill="#00FF41" opacity="0.04" filter="url(#neonGlow)"/>
    <circle cx="0" cy="0" r="180" fill="#00F3FF" opacity="0.05" filter="url(#neonGlow)"/>

    <!-- Orbital Rings -->
    <circle cx="0" cy="0" r="195" fill="none" stroke="rgba(0, 243, 255, 0.2)" stroke-width="1.5" stroke-dasharray="10 8"/>
    <circle cx="0" cy="0" r="165" fill="none" stroke="rgba(188, 19, 254, 0.25)" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- Center Crest Shield -->
    <circle cx="0" cy="0" r="135" fill="#050b14" stroke="url(#borderGrad)" stroke-width="3.5" filter="url(#softGlow)"/>

    <!-- Lorapok Cyborg Insect / Agent Mascot Inside Crest -->
    <g transform="translate(0, 16) scale(0.68)">
      <!-- Abdomen Segments -->
      <ellipse cx="65" cy="55" rx="38" ry="27" fill="#1e293b"/>
      <ellipse cx="32" cy="45" rx="35" ry="25" fill="#243347"/>
      <ellipse cx="0" cy="32" rx="33" ry="24" fill="#2d3f57"/>
      <ellipse cx="-32" cy="18" rx="38" ry="28" fill="#334155"/>
      <ellipse cx="-70" cy="-8" rx="46" ry="40" fill="#3b4d66"/>

      <!-- Visor Headpiece -->
      <rect x="-115" cy="-35" width="82" height="48" rx="20" fill="#030712" stroke="#00F3FF" stroke-width="3.5"/>
      <!-- Glowing Eyes -->
      <circle cx="-92" cy="-11" r="11" fill="#00FF41" filter="url(#softGlow)"/>
      <circle cx="-54" cy="-11" r="11" fill="#00FF41" filter="url(#softGlow)"/>

      <!-- Antennas with Energy Nodules -->
      <path d="M -92 -45 Q -105 -78 -120 -88" fill="none" stroke="#00F3FF" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-120" cy="-88" r="8" fill="#00F3FF" filter="url(#softGlow)"/>

      <path d="M -48 -45 Q -35 -78 -20 -88" fill="none" stroke="#00FF41" stroke-width="4" stroke-linecap="round"/>
      <circle cx="-20" cy="-88" r="8" fill="#00FF41" filter="url(#softGlow)"/>
    </g>

    <!-- Bottom Emblem Ribbon -->
    <g transform="translate(0, 160)">
      <rect x="-110" y="-16" width="220" height="32" rx="16" fill="#07101e" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.2"/>
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#38BDF8" text-anchor="middle" letter-spacing="1.5">
        LORAPOK LABS
      </text>
    </g>
  </g>
</svg>
