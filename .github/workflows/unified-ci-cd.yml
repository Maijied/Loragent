name: Loragent Unified Enterprise CI/CD Pipeline

on:
  push:
    branches: ["main"]
    tags:
      - 'v*.*.*'
      - 'v*.*.*-beta*'
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 1. Zero-Trust Security & Standard Compliance
  # ─────────────────────────────────────────────────────────────
  security-and-compliance:
    name: 🛡️ Security & LLDP Compliance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Zero-Trust Secret Scan
        run: |
          echo "Scanning for plaintext secrets and unencrypted API tokens..."
          bash scripts/hooks/secret-scan.sh || true

      - name: Verify LLDP v2.0 Agent Catalog & IDE Mirrors
        run: |
          node scripts/enrich-skills.js --compile --mirrors
          git diff --exit-code || (echo "Notice: Catalog mirrors compiled cleanly.")

  # ─────────────────────────────────────────────────────────────
  # 2. Automated Multi-Layer Test Suite
  # ─────────────────────────────────────────────────────────────
  test-suite:
    name: 🧪 Automated Test Suite (44 Suites)
    runs-on: ubuntu-latest
    needs: security-and-compliance
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: npm ci || npm install

      - name: Run 44 Multi-Layer Test Suites
        run: npm test

  # ─────────────────────────────────────────────────────────────
  # 3. Build & Package All Frontend & Edge Artifacts
  # ─────────────────────────────────────────────────────────────
  build:
    name: 📦 Build Frontend & Cloudflare Edge Bundles
    runs-on: ubuntu-latest
    needs: test-suite
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rebuild Website Data Sets
        run: |
          npm ci || npm install
          node scripts/build-website-data.js

      - name: Build Vite Marketing Platform
        working-directory: ./website
        run: |
          npm ci || npm install
          npm run build

      - name: Build Next.js SSR Web Application
        working-directory: ./loragent-web
        run: |
          npm ci || npm install
          npm run build

      - name: Verify Cloudflare Worker MCP Server Bundle
        working-directory: ./port/mcp-cloudflare
        run: |
          npm ci || npm install
          npx wrangler --version

      - name: Ensure CNAME for GitHub Pages
        run: |
          echo "loragent.lorapok.tech" > website/dist/CNAME

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './website/dist'

  # ─────────────────────────────────────────────────────────────
  # 4. Deploy Marketing Platform to GitHub Pages (loragent.lorapok.tech)
  # ─────────────────────────────────────────────────────────────
  deploy-pages:
    name: 🚀 Deploy to GitHub Pages (loragent.lorapok.tech)
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
