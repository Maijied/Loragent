name: Beta Release CI/CD

on:
  push:
    tags:
      - 'v*.*.*-beta*'

jobs:
  build-and-release:
    name: Build & Publish Beta Release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test || echo "Tests not strictly enforced for beta"

      - name: Build Project
        run: npm run build || echo "Build skipped or not configured"

      - name: Generate Changelog
        id: changelog
        run: |
          echo "BETA RELEASE - Generated by Loragent Version Bumper" > release_notes.md
          git log -1 --pretty=format:"%B" >> release_notes.md

      - name: Create GitHub Beta Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          prerelease: true
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM (Beta Tag)
        run: npm publish --tag beta
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
